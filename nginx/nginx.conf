# nginx перед двома інстансами API. Round robin без sticky-сесій: socket.io працює завдяки Redis-адаптеру.
# /socket.io/ потребує заголовків Upgrade/Connection, інакше WebSocket не підніметься.
events { worker_connections 1024; }

http {
  upstream api {
    server api-1:3000;
    server api-2:3000;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # SSE і довгі запити: не буферизувати і не рвати через 60 с.
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $http_x_request_id;
    }
  }
}
